name: CI Pipeline

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Installer l'environnement Python
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 3. Compiler / Valider le projet
      - name: Vérifier la syntaxe Python
        run: python -m py_compile app.py

      - name: Vérifier les fichiers frontend
        run: |
          test -f index.html && echo "index.html OK"
          test -f style.css && echo "style.css OK"
          test -f script.js && echo "script.js OK"

      - name: Vérifier que l'application démarre
        run: |
          python -c "from app import app; print('Build OK - Flask app loaded successfully')"
