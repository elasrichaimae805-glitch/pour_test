name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint avec flake8
        run: |
          flake8 app.py --max-line-length=120 --statistics

      - name: Vérifier que le serveur démarre
        run: |
          python -c "from app import app; client = app.test_client(); response = client.get('/api/products'); assert response.status_code == 200"

      - name: Tests API produits
        run: |
          python -c "
          from app import app
          client = app.test_client()

          # GET tous les produits
          r = client.get('/api/products')
          assert r.status_code == 200
          data = r.get_json()
          assert len(data) == 12

          # Filtrer par catégorie
          r = client.get('/api/products?category=electronics')
          assert r.status_code == 200
          data = r.get_json()
          assert all(p['category'] == 'electronics' for p in data)

          # Recherche
          r = client.get('/api/products?search=casque')
          assert r.status_code == 200
          data = r.get_json()
          assert len(data) >= 1

          print('All product API tests passed')
          "

      - name: Tests API panier
        run: |
          python -c "
          from app import app
          client = app.test_client()

          # Ajouter au panier
          r = client.post('/api/cart/add', json={'productId': 1})
          assert r.status_code == 200
          data = r.get_json()
          cart_id = data['cartId']
          assert len(data['items']) == 1
          assert data['items'][0]['qty'] == 1

          # Ajouter encore (qty = 2)
          r = client.post('/api/cart/add', json={'productId': 1}, headers={'X-Cart-Id': cart_id})
          data = r.get_json()
          assert data['items'][0]['qty'] == 2

          # Modifier quantité
          r = client.put('/api/cart/update', json={'productId': 1, 'qty': 5}, headers={'X-Cart-Id': cart_id})
          data = r.get_json()
          assert data['items'][0]['qty'] == 5

          # Supprimer du panier
          r = client.delete('/api/cart/remove', json={'productId': 1}, headers={'X-Cart-Id': cart_id})
          data = r.get_json()
          assert len(data['items']) == 0

          # Checkout panier vide
          r = client.post('/api/cart/checkout', headers={'X-Cart-Id': cart_id})
          assert r.status_code == 400

          # Checkout avec produit
          client.post('/api/cart/add', json={'productId': 3}, headers={'X-Cart-Id': cart_id})
          r = client.post('/api/cart/checkout', headers={'X-Cart-Id': cart_id})
          assert r.status_code == 200
          data = r.get_json()
          assert 'orderId' in data

          print('All cart API tests passed')
          "

      - name: Valider les fichiers frontend
        run: |
          test -f index.html && echo "index.html OK"
          test -f style.css && echo "style.css OK"
          test -f script.js && echo "script.js OK"
